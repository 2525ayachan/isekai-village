<title>異世界辺境開拓記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* スマホ専用の全画面レイアウト：上に暦と資源のHUD、まん中いっぱいに辺境の村の地図、下にコマンドボタン。生成りの紙と木の枠の明るい単一テーマ */
:root {
  --bg: #f7edd6;
  --panel: #fffaf0;
  --panel-2: #f1e3c4;
  --line: #5a3a22;
  --frame: #a8703e;
  --ink: #3b2716;
  --ink-dim: #7d6448;
  --gold: #f5b83a;
  --accent: #c25a1c;
  --mana: #2f9fd0;
  --bad: #c8392b;
  --good: #3d9a3a;
  --warn: #c98a1a;
  --btn: #4c9a45;
  --btn-dis: #e2d5b8;
  --track: #e8d9b6;
  --pixel: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
/* 文字の大きさ：画面の幅に合わせて自動で決め（360pxで約14px・390pxで15px・430px以上で16px）、設定の「小・ふつう・大」で微調整 */
html { font-size: calc(clamp(13.5px, 3.85vw, 16px) * var(--fs-mul, 1)); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: #e9d9b4; color: var(--ink);
  font-family: var(--pixel); font-size: .94rem; line-height: 1.5;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  position: fixed; inset: 0; max-width: 560px; margin: 0 auto;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--bg);
}
.win {
  background: var(--panel);
  border: 3px solid var(--frame);
  box-shadow: 0 0 0 3px var(--line), inset 0 0 0 2px var(--line);
  border-radius: 4px;
}
/* 上部HUD（常に表示） */
.hud {
  background: var(--panel); border-bottom: 3px solid var(--frame); box-shadow: 0 3px 0 var(--line);
  padding: calc(6px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 4px; z-index: 5;
}
.hud1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ttl { min-width: 0; }
.ttl h1 { margin: 0; font-size: 1.15rem; font-weight: 400; line-height: 1.15; color: var(--accent); text-shadow: 1px 1px 0 #f6d9a4; white-space: nowrap; }
.ttl .sub { color: var(--ink-dim); font-size: .66rem; line-height: 1.3; }
.clockbox { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.clock { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-dim); white-space: nowrap; font-size: .72rem; line-height: 1.2; }
.clock b { color: var(--ink); font-weight: 400; font-size: 1rem; }
.speed { display: flex; gap: 3px; }
.speed button {
  font: inherit; font-size: .74rem; min-width: 36px; min-height: 28px; padding: 2px 6px; border: 0; border-radius: 3px; cursor: pointer;
  background: var(--panel-2); color: var(--ink-dim);
}
.speed button.on { background: var(--accent); color: #fff; }
.res { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--panel-2); box-shadow: inset 0 0 0 1px #e2cfa6; border-radius: 3px; padding: 4px 2px; }
.chip { display: grid; grid-template-columns: auto auto; justify-content: center; align-items: center; column-gap: 4px; min-width: 0; text-align: left; }
.chip img { width: 16px; height: 16px; image-rendering: pixelated; grid-row: span 2; }
.chip:not(.two) img { grid-row: auto; }
.chip .v { font-size: .86rem; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; }
.chip .r { font-size: .58rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.15; }
.chip .r.good { color: var(--good); } .chip .r.neg { color: var(--bad); }
.season { font-size: .68rem; color: var(--ink-dim); text-align: center; line-height: 1.25; }
.season .up { color: var(--bad); }

/* 地図（全画面） */
.stage { position: relative; min-height: 0; overflow: hidden; }
.mapbox { position: absolute; inset: 0; overflow: hidden; background: var(--line); }
#map { background: #2c6437; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#map.paint { cursor: crosshair; }
.mapctl { position: absolute; top: 8px; right: max(8px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 6px; }
.mapctl button, .roadbtn {
  font: inherit; width: 42px; height: 42px; border: 2px solid var(--frame); border-radius: 4px; cursor: pointer;
  background: rgba(255,250,240,.94); color: var(--ink); font-size: 1.15rem; line-height: 1; box-shadow: 0 2px 0 rgba(90,58,34,.35);
}
.mapbtns { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); bottom: 8px; display: flex; gap: 6px; }
.roadbtn { width: auto; padding: 0 14px; font-size: .9rem; }
.roadbtn.on { background: var(--gold); color: var(--ink); }
.folk { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.folk > * { display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: .74rem; color: var(--ink);
  background: var(--panel-2); border: 0; border-radius: 6px; padding: 6px 4px; cursor: pointer; min-width: 0; }
.folk img { width: 30px; height: 39px; image-rendering: pixelated; }
.folk .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folk .sb { font-size: .64rem; color: var(--ink-dim); }
.folk .empty { background: transparent; border: 2px dashed var(--panel-2); color: var(--ink-dim); cursor: default; justify-content: center; min-height: 72px; }
.line { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .84rem; color: var(--ink-dim); }
.line b { font-weight: 400; color: var(--ink); }
details.more { border-top: 2px solid var(--panel-2); padding-top: 6px; }
details.more > summary { cursor: pointer; font-size: .85rem; color: var(--frame); list-style: none; padding: 4px 0; }
details.more > summary::before { content: '▸ '; }
details.more[open] > summary::before { content: '▾ '; }
details.more > *:not(summary) { margin-top: 8px; }
.banner { position: absolute; left: 8px; right: 58px; top: 8px; background: rgba(255,250,240,.95); color: var(--ink); border: 2px solid var(--frame); font-size: .78rem; padding: 6px 10px; border-radius: 3px; pointer-events: none; }

/* 下部ナビ */
.nav {
  display: flex;
  background: #5a3a22; border-top: 3px solid var(--frame); box-shadow: 0 -3px 0 var(--line);
  padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px));
  z-index: 5;
}
.nav button[hidden] { display: none; }
.nav button {
  flex: 1 1 0; min-width: 0;
  font: inherit; font-size: .66rem; white-space: nowrap; color: #e9d6b0; background: none; border: 0; border-radius: 3px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 50px; padding: 4px 0; position: relative;
}
.nav button img, .nav button svg { width: 16px; height: 24px; image-rendering: pixelated; }
.nav button.locked { opacity: .4; filter: grayscale(1); }
.nav button.locked::after { content: '🔒'; position: absolute; top: 4px; right: calc(50% - 20px); font-size: .62rem; filter: none; }
.nav button.unlocked-new { animation: mpop2 .8s ease-out 3; }
@keyframes mpop2 { 50% { transform: scale(1.15); background: var(--gold); } }
.nav button.on { background: #7a5232; color: var(--gold); box-shadow: inset 0 -3px 0 var(--gold); }
.nav .dot { position: absolute; top: 4px; right: calc(50% - 18px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: .62rem; line-height: 16px; text-align: center; }
.nav .dot[hidden] { display: none; }
.nav .dot.sm { min-width: 10px; width: 10px; height: 10px; padding: 0; top: 6px; right: calc(50% - 14px); background: var(--gold); }

/* ページ（タブの中身）と、地図の上に出るシート */
#panel[hidden] { display: none; }
.panel.page { position: absolute; inset: 0; border: 0; border-radius: 0; box-shadow: none; overflow-y: auto; overscroll-behavior: contain; z-index: 3; background: #e7d3a6; --panel-2: #f6ead0;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-bottom: 24px; }
.panel.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 58%; overflow-y: auto; overscroll-behavior: contain; z-index: 3;
  border-bottom: 0; border-radius: 10px 10px 0 0; box-shadow: 0 -3px 0 var(--line), 0 -8px 24px rgba(60,40,20,.35); }
.sheetx { position: sticky; top: -14px; align-self: flex-end; margin: -14px -14px -44px 0; z-index: 2; display: flex; justify-content: flex-end; padding: 6px; }
.sheetx button { font: inherit; width: 40px; height: 40px; border: 2px solid var(--frame); border-radius: 4px; background: var(--panel-2); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
.panel.sheet > h2 { padding-right: 44px; }
.panel.sheet.layout { max-height: 40%; }
.panel.sheet.layout .nudge { margin: 0; }
.pagefoot { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; padding-top: 10px; border-top: 2px solid var(--panel-2); }
.pagefoot p { font-size: .75rem; }
.panel { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { margin: 0; font-size: 1.15rem; font-weight: 400; display: flex; align-items: center; gap: 8px; }
.panel h2 img { width: 32px; height: 48px; image-rendering: pixelated; }
.panel h2 img.face { width: 30px; height: 39px; }
.panel h3 { margin: 4px 0 0; font-size: .85rem; font-weight: 400; color: var(--frame); letter-spacing: .08em; }
.panel p { margin: 0; color: var(--ink-dim); font-size: .86rem; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: .85rem; border: 0; padding: 6px 10px; border-radius: 3px; cursor: pointer; background: var(--panel-2); color: var(--ink-dim); }
.tabs button.on { background: var(--frame); color: #fff; }
.warn { background: #fde3dc; color: #8a2418; box-shadow: inset 3px 0 0 var(--bad); padding: 6px 10px; font-size: .82rem; }
.warn.soft { background: #fff1c9; color: #7a4f0a; box-shadow: inset 3px 0 0 var(--warn); }
.nudge { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 8px; }
.nudge .btn, .nudge .btn.sub { justify-content: center; font-size: 1.25rem; padding: 6px 0; }
.warn.xw { display: flex; align-items: flex-start; gap: 6px; }
.warn.xw > span { flex: 1; }
.warn .x { background: none; border: 0; color: inherit; font: inherit; font-size: 1rem; line-height: 1; padding: 2px 4px; margin: -2px -4px -2px 0; cursor: pointer; opacity: .8; min-width: 28px; min-height: 24px; }
.ok { background: #e3f3d6; color: #2b6a27; box-shadow: inset 3px 0 0 var(--good); padding: 6px 10px; font-size: .82rem; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: .86rem; font-variant-numeric: tabular-nums; }
.stats > span:nth-child(odd) { color: var(--ink-dim); white-space: nowrap; }
.bar { height: 10px; background: var(--track); border: 2px solid var(--panel-2); }
.bar i { display: block; height: 100%; background: var(--mana); }
.bar.sat i { background: var(--good); }
.bar.sat.mid i { background: var(--warn); }
.bar.sat.low i { background: var(--bad); }

.table { display: grid; grid-template-columns: 16px minmax(0,1fr) auto auto auto; gap: 4px 10px; align-items: center; font-size: .82rem; font-variant-numeric: tabular-nums; }
.table .h { color: var(--frame); font-size: .72rem; }
.table img { width: 16px; height: 16px; image-rendering: pixelated; }
.table .n { text-align: right; }
.up { color: var(--bad); } .down { color: var(--good); }
.trade { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 6px 8px; align-items: center; font-size: .84rem; font-variant-numeric: tabular-nums; }
.trade img { width: 16px; height: 16px; image-rendering: pixelated; }
.trade .acts { display: flex; gap: 4px; }
.mini { font: inherit; font-size: .78rem; border: 0; border-radius: 3px; padding: 4px 8px; cursor: pointer; background: var(--btn); color: #fff; }
.mini:disabled { background: var(--btn-dis); color: var(--ink-dim); cursor: default; }
.people { display: flex; flex-direction: column; gap: 4px; }
.person {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 0 8px; align-items: center; text-align: left;
  font: inherit; font-size: .84rem; color: var(--ink); background: var(--panel-2); border: 0; border-radius: 3px; padding: 6px 8px; cursor: pointer;
}
.person img { width: 20px; height: 26px; image-rendering: pixelated; grid-row: span 2; }
.person .sub { color: var(--ink-dim); font-size: .72rem; grid-column: 2; }
.person .s { grid-row: 1 / span 2; grid-column: 3; font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag:disabled { opacity: .45; cursor: default; }
.tag { font: inherit; font-size: .78rem; border: 0; border-radius: 3px; padding: 3px 8px; background: var(--panel-2); color: var(--ink); cursor: pointer; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--ink-dim); cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

.build { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card {
  display: grid; grid-template-columns: 32px 1fr; gap: 2px 8px; align-items: center;
  text-align: left; padding: 8px; border: 0; cursor: pointer; border-radius: 3px;
  background: var(--panel-2); color: var(--ink); font: inherit; font-size: .82rem;
  box-shadow: inset 0 -3px 0 0 rgba(90,58,34,.18);
}
.card img { grid-row: span 3; width: 32px; height: 48px; image-rendering: pixelated; }
.card .nm { font-size: .92rem; }
.card .fx { color: var(--ink-dim); font-size: .72rem; }
.card .pk { grid-column: 1 / -1; font-size: .72rem; line-height: 1.45; color: var(--accent); border-top: 1px dashed rgba(90,58,34,.2); padding-top: 4px; margin-top: 2px; }
.card.on { box-shadow: inset 0 0 0 2px var(--accent); }

.cost { display: flex; flex-wrap: wrap; gap: 2px 8px; font-variant-numeric: tabular-nums; font-size: .78rem; }
.cost span { display: inline-flex; align-items: center; gap: 3px; }
.cost img { width: 12px; height: 12px; image-rendering: pixelated; }
.cost .no { color: var(--bad); }

.btn {
  font: inherit; font-size: 1rem; border: 0; cursor: pointer; padding: 10px 14px; border-radius: 3px;
  background: var(--btn); color: #fff; text-align: left;
  box-shadow: inset 0 -4px 0 0 rgba(0,0,0,.3), inset 0 3px 0 0 rgba(255,255,255,.15);
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
}
.btn:active:not(:disabled), .card:active:not(:disabled), .mini:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { background: var(--btn-dis); color: var(--ink-dim); box-shadow: none; cursor: default; }
.btn.sub { background: transparent; color: var(--ink-dim); box-shadow: inset 0 0 0 2px var(--panel-2); font-size: .85rem; padding: 8px 12px; }
.btn.danger { color: var(--bad); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1; }

.events { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: .8rem; }

.ev { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 2px 8px; align-items: center; }
.ev .tg { font-size: .68rem; padding: 1px 6px; border-radius: 3px; background: var(--panel-2); color: var(--accent); }
.ev.threat .tg { background: #fde3dc; color: #8a2418; }
.ev.done { opacity: .55; }
.ev .n { font-variant-numeric: tabular-nums; }
.ev .bar { grid-column: 1 / -1; height: 8px; }

.ev .bar.ok i { background: var(--good); }
.evcard { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; background: var(--panel-2); border-radius: 3px; }
.evcard.threat { box-shadow: inset 3px 0 0 var(--bad); }
.evcard p { font-size: .8rem; }
/* チュートリアル：スポットライト＋矢印＋吹き出し */
.gblock { position: fixed; z-index: 40; background: rgba(40,26,12,.55); touch-action: none; }
.gblock[hidden], .gspot[hidden], .garrow[hidden], .gbub[hidden], .talk[hidden] { display: none; }
.gspot { position: fixed; z-index: 41; pointer-events: none; border: 3px solid var(--gold); border-radius: 8px; box-shadow: 0 0 0 3px rgba(255,255,255,.6), 0 0 18px 4px rgba(245,184,58,.8); animation: gpulse 1.2s ease-in-out infinite; }
@keyframes gpulse { 50% { box-shadow: 0 0 0 3px rgba(255,255,255,.3), 0 0 28px 8px rgba(245,184,58,1); } }
.garrow { position: fixed; z-index: 42; pointer-events: none; font-size: 30px; line-height: 1; color: var(--gold); text-shadow: 0 2px 0 var(--line), 0 0 6px #fff; animation: gbob .7s ease-in-out infinite alternate; }
.garrow.up { animation-name: gbobu; }
@keyframes gbob { from { transform: translate(-50%, -6px); } to { transform: translate(-50%, 4px); } }
@keyframes gbobu { from { transform: translate(-50%, 6px); } to { transform: translate(-50%, -4px); } }
.gbub { position: fixed; z-index: 43; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; background: var(--panel); border: 3px solid var(--frame); border-radius: 8px; box-shadow: 0 0 0 3px var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.gbub .gt { font-size: 1.08rem; line-height: 1.55; color: var(--ink); }
.gbub .glist { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: .82rem; }
.gbub .glist img { width: 14px; height: 14px; image-rendering: pixelated; vertical-align: -2px; margin-right: 4px; }
.gbub { min-height: 64px; }
.gcheck { position: absolute; right: 10px; bottom: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--good); color: #fff;
  font-size: 1.3rem; line-height: 34px; text-align: center; box-shadow: 0 2px 0 rgba(0,0,0,.25); animation: gchk .35s ease-out; }
@keyframes gchk { from { transform: scale(0); } 70% { transform: scale(1.25); } to { transform: scale(1); } }
.gbub .gs { font-size: .66rem; color: var(--ink-dim); align-self: flex-start; }
.gbub .grow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gbub button { font: inherit; border: 0; cursor: pointer; border-radius: 4px; }
.gbub .gok { background: var(--btn); color: #fff; padding: 9px 22px; font-size: 1rem; }
.gbub .gskip { background: none; color: var(--ink-dim); font-size: .72rem; padding: 4px 0; text-decoration: underline; }
#scene { position: fixed; inset: 0; z-index: 45; touch-action: none; }

#scene::before { top: 0; } #scene::after { bottom: 0; }

  display: grid; grid-template-columns: 44px 1fr; gap: 6px 12px; align-items: start; min-height: 120px;
  background: rgba(255,250,240,.98); border: 3px solid var(--frame); border-radius: 10px; padding: 14px 16px; box-shadow: 0 2px 0 rgba(90,58,34,.35); }
.talk .tb { margin-top: 4px; }

.talk .tnext { background: var(--btn); color: #fff; padding: 9px 22px; font-size: 1rem; }

const fx = [];
function produce(dtH, h, X, live) {
  const work = h >= 7 && h < 17, night = h >= 20 || h < 5;
  S.tiles.forEach((t, i) => {
    if (!t) return;
    const d = B[t.b];
    if (!d.recipes) return;
    const rec = recipeOf(t);
    if (d.animal && !(t.pets > 0)) { t.st = 'nopet'; t.eff = 0; return; }
    const slots = slotsOf(t), sf = X.staff[i];
    const ratio = slots ? Math.min(1, (sf ? sf.n : 0) / slots) : 1;
    const open = d.hours ? h >= d.hours[0] && h < d.hours[1] : work;
    if (!d.allDay && !open) { if (t.st !== 'input') t.st = 'rest'; t.eff = 0; return; }
    if (ratio <= 0) { t.st = 'staff'; t.eff = 0; return; }
    let eff = ratio * (.6 + .6 * (sf.sat / sf.n) / 100) * ((sf.f || sf.n) / sf.n) * (roadNear(i) ? 1.25 : 1) * X.mult;
    if (t.b === 'field') {
      const se = cal().season;
      if (rec.season != null && rec.season !== se) { t.st = 'season'; t.eff = 0; return; }
      eff *= 1 + .15 * X.mage; if (rec.night && night) eff *= rec.night;
      if (se === 3) eff *= .5; if (se === 2) eff *= 1.5;
    }
    t.eff = eff;
    if (!t.loaded) {
      if (keepsWheat(t, rec)) { t.st = 'keep'; t.eff = 0; return; }
      if (canAfford(rec.in)) { useAll(rec.in); t.loaded = true; }
      else { t.st = 'input'; t.prog = 0; return; }
    }
    t.st = 'ok';
    t.prog = (t.prog || 0) + dtH * eff * (d.animal ? t.pets / 2 : t.lv) / rec.h;
    let guard = 0;
    while (t.prog >= 1 && guard++ < 60) {
      t.prog -= 1;
      const goods = {};
      for (const [k, v] of Object.entries(rec.out)) { if (live && k !== 'gold' && k !== 'mana' && t.b !== 'warehouse') goods[k] = v; else add(k, v); S.st.today.made[k] = (S.st.today.made[k] || 0) + v; }
      if (Object.keys(goods).length) sendGoods(i, goods);
      if (t.b === 'mine' && cal().season === 3) { S.loot.ice = (S.loot.ice || 0) + .4; if (S.loot.ice >= 1) { S.loot.ice -= 1; add('ice', 1); } }
      if (live) {
        fxH(i, rec.out.star || rec.out.wheat ? C.wheatH : rec.out.mana ? C.mana : rec.out.scale ? C.red : C.white);
        if (rec.id === 'mandra' && Math.random() < .3) say(nearestWorker(i), 'マンドラゴラが叫んだ！耳がー！', 4);
      }

      if (canAfford(rec.in)) useAll(rec.in);

    }
  });
}

  s.st = s.st || {}; s.st.today = Object.assign(newDayStats(), s.st.today || {});
  ['inv', 'flags', 'unlock', 'loot', 'seen'].forEach(k => { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
  // なくなった建物・作り方は片づける
  s.tiles = s.tiles.map(t => {
    if (!t) return null;
    if (!B[t.b]) return null;
    const rs = B[t.b].recipes;
    if (rs && t.b !== 'field' && !rs.some(r => r.id === t.r)) { t.r = rs[0].id; t.prog = 0; t.loaded = false; }

  s.residents.forEach(r => {

    if (r.home != null && !s.tiles[r.home]) r.home = null;

  Object.keys(s.inv).forEach(k => { if (!ITEMS[k] || !(s.inv[k] >= 0)) delete s.inv[k]; });

  if (s.guide && !s.guide.done && s.storySeen) {
    const mi = TALK.findIndex(st => st.unlock === 'mission');
    if ((s.tut && (s.tut.g > 0 || s.tut.goalDone)) || (s.unlock && s.unlock.mission && s.guide.i >= GUIDE.length + mi)) s.guide.done = true;
  }

      const ch = row[c];

    }
  }
}

const OLCACHE = new Map();
function withOutline(rows) {
  let out = OLCACHE.get(rows);

  const G = Array.from({ length: h }, (_, y) => Array.from({ length: w }, (_, x) => (rows[y - 1] || '')[x - 1] || '.'));
  const filled = (x, y) => x >= 0 && y >= 0 && x < w && y < h && G[y][x] !== '.' && G[y][x] !== 'O';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)

  out = G.map(a => a.join(''));

}

const b64 = u8 => { let t = ''; for (let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(t); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function packSave() {
  save();
  const raw = new TextEncoder().encode(JSON.stringify(S));
  if (window.CompressionStream) {
    const z = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    return 'ISEKAI1:' + b64(z);
  }
  return 'ISEKAI0:' + b64(raw);
}
async function unpackSave(code) {
  code = (code || '').replace(/\s+/g, '');
  const m = code.match(/^ISEKAI([01]):(.+)$/); if (!m) throw new Error('form');
  let u8 = unb64(m[2]);
  if (m[1] === '1') {
    if (!window.DecompressionStream) throw new Error('nozip');
    u8 = new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  }
  const s = JSON.parse(new TextDecoder().decode(u8));
  if (!valid(s)) throw new Error('form');
  return migrateSave(s);
}

  try { const rec = JSON.parse(localStorage.getItem(REC_KEY) || '[]'); return rec.reduce((m, x) => Math.max(m, x.days || 0), 0); } catch (err) { return 0; }
}
// 1マス単位の古いセーブを半マス格子に変換（見た目の配置はそのまま）
function migrateHalf(s) {
  const nt = Array(HN).fill(null);
  s.tiles.forEach((t, i) => { if (t) nt[t2h(i)] = t; });
  s.tiles = nt;
  const cv = v => v == null || v < 0 ? v : t2h(v);
  s.residents.forEach(r => { r.home = cv(r.home); r.job = cv(r.job); r.seat = cv(r.seat); r.prevJob = cv(r.prevJob); if (r.spawn != null) r.spawn = cv(r.spawn); });
  s.plaza = cv(s.plaza);
  if (s.sel) delete s.sel;
  s.half = true;
}
function freshVillage() {
  S = newState(); rebuildOcc(); genEvents(false);
  sel = null; moveMode = null; agents.clear(); terrDirty = true; lastHTML = ''; lastEvHTML = '';
  curSeason = -1; applySeason();
  DEM = demand(); assign(); lastX = context();
  centerOn(S.plaza, vw / (9 * T)); save(); renderPanel(true);
  renderMission(); renderGuide(true); showStory(0);
}
function showOver() {
  const o = S.over;
  $('modalBox').className = 'box win'; $('modal').onclick = null;
  $('modalBox').innerHTML = `<h3>村は滅びました</h3><p>${o.reason}</p>
    <div class="stats">
      <span>続いた期間</span><span>${o.year}年目の${SEASONS[o.season]}まで（${o.days}日）</span>
      <span>いちばん多かった住人</span><span>${o.maxPop}人</span>
      <span>これまでの最長記録</span><span>${bestRecord()}日</span>
    </div>
    <button class="btn" id="newgame"><span>新しい村をはじめる</span></button>`;
  $('modal').hidden = false;
  $('newgame').onclick = () => { $('modal').hidden = true; freshVillage(); };
}
function showWelcome(sec, b) {
  const days = (S.day - b.day) + (S.min - b.min) / 1440;
  $('modalBox').className = 'box win'; $('modal').onclick = null;
  $('modalBox').innerHTML = `<h3>おかえりなさい、旅人さん</h3>
    <p>${dur(sec)}のあいだに、村では約${days.toFixed(1)}日が過ぎました。</p>
    <div class="stats">
      <span>ゴールド</span><span>${S.gold >= b.gold ? '+' : ''}${num(S.gold - b.gold)}</span>
      <span>住人</span><span>${b.pop}人 → ${S.residents.length}人</span>
      <span>引っ越してきた</span><span>${S.st.arr - b.arr}人</span>
      <span>出ていった</span><span>${S.st.left - b.left}人</span>
      <span>生まれた・亡くなった</span><span>${(S.st.born || 0) - b.born}人・${(S.st.dead || 0) - b.dead}人</span>
      <span>いまの季節</span><span>${cal().year}年目 ${SEASONS[cal().season]} ${cal().dow}日目</span>
    </div>
    <button class="btn" id="ok"><span>村にもどる</span></button>`;
  $('modal').hidden = false;
  $('ok').onclick = () => { $('modal').hidden = true; };
}

// ======================================================================
// loop
// ======================================================================
let last = performance.now(), acc = 0, pacc = 0, saveAcc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  try { frame(now); } catch (err) { console.error(err); }
}
function frame(now) {
  const dt = Math.min(.25, (now - last) / 1000); last = now; NOW = now;
  if (S.over) { if ($('modal').hidden) showOver(); draw(dt); return; }
  applySeason();
  const boost = nightBoost(), spd = titleOn || scene || modalOpen() || guideStep() || (mgStep() && !mgStep().noPause) ? 0 : S.speed;
  if (scene) sceneFrame(); else startScene();
  if (!scene && (guideActive() || S.mg || noteQ.length || !$('talk').hidden || !$('gbub').hidden)) renderGuide(false);
  if (spd > 0) { inSim = true; try { simStep(dt * GMIN * BASE_SPEED * spd * boost / 60, true); } finally { inSim = false; } }
  moveAgents(dt, BASE_SPEED * (scene ? 1.2 : spd) * boost);
  moveShips(dt, BASE_SPEED * spd * boost);
  if (spd > 0 && !guideActive()) chatter(dt);
  acc += dt; pacc += dt; saveAcc += dt;
  if (acc > .25) { acc = 0; updateTop(); checkRequests(); if (toastBusy) placeToast(); }
  if (pacc > 1) { pacc = 0; renderPanel(false); }
  if (saveAcc > 5) { saveAcc = 0; save(); }
  draw(dt);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
  else { catchUp(); last = performance.now(); lastHTML = ''; renderPanel(true); }
});
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => { if (S && guideActive()) renderGuide(false); });

function start(data) {
  const hot = data && valid(data.S);
  const ld = hot ? null : load(); hadSave = !!ld;
  S = hot ? data.S : (ld || newState());
  if (!S.half) migrateHalf(S);
  rebuildOcc();
  if (!S.ev) genEvents(false);
  if (!S.ruins) S.ruins = genRuins(S);
  if (!S.clear) S.clear = [];
  if (!S.ship) S.ship = [];
  if (!S.pend) S.pend = [];
  if (S.tut && S.tut.g == null) S.tut.g = 0;
  S.tiles.forEach(t => { if (t && B[t.b].animal && t.pets == null) t.pets = 2; });
  S.residents.forEach(r => { if (r.everJob == null) r.everJob = r.job != null; });
  if (!S.tut) S.tut = { i:0, on:true };
  if (!S.guide) { S.guide = { i: S.storySeen ? GUIDE.length + TALK.length : 0, done: !!S.storySeen }; if (S.storySeen) S.tut.i = 0; }
  if (!S.unlock) {
    if (guideActive()) { S.unlock = {}; S.guide.i = 0; }
    else S.unlock = { people:1, village:1, mission:1, store:1, merchant:1, growth:1 };
  }
  if (!S.flags) S.flags = {};
  if (guideActive() && stepAt() && stepAt().enter && !(S.seenScene || {}).settler) stepAt().enter();
  if (!S.founders) S.founders = S.residents.slice(0, 3).map(r => r.id);
  if (!S.speedV2) { S.speed = S.speed > 0 ? 1 : 0; S.speedV2 = true; }
  if (!S.bigStart) {
    for (let r = 8; r <= 15; r++) for (let c = 8; c <= 15; c++) {
      const j = r * W + c;
      if (!S.open[j] && !ruinAt(j)) { S.open[j] = true; S.clear = (S.clear || []).filter(q => q.i !== j); S.residents.forEach(q => { if (q.clearing === j) q.clearing = null; }); }
    }
    S.bigStart = true; terrDirty = true;
  }
  if (!S.tiles.some(t => t && t.b === 'warehouse')) {
    const p0 = h2t(S.plaza), seen = new Set([p0]), q = [p0];
    while (q.length) {
      const u = q.shift();
      if (S.open[u] && OCC[u] < 0 && !S.road[u]) { S.tiles[t2h(u)] = { b:'warehouse', lv:1 }; rebuildOcc(); terrDirty = true; break; }
      NB[u].forEach(v => { if (!seen.has(v) && S.open[v]) { seen.add(v); q.push(v); } });
    }
  }
  STORE_CAP = storeCap();
  applySeason();
  makeIcons(); setNavIcons();
  new ResizeObserver(resize).observe(cv);
  resize();
  if (hot && data.cam) Object.assign(cam, data.cam); else centerOn(S.plaza, vw / (9 * T));
  if (!hot) catchUp();
  DEM = demand(); assign(); lastX = context();
  FOREST_ICON = iconURL(32, 48, () => { g.scale(2, 2); drawForest(0, 8, 7); outlined(0, 8, 16, 16, () => forestDeco(0, 8, 7)); });
  RUIN_ICON = iconURL(32, 48, () => { g.scale(2, 2); drawGrass(0, 8, 3); outlined(0, 8, 16, 16, () => drawRuin({ a:0, w:1, h:1 })); });
  renderPanel(true); updateTop();
  if (hot) { if (!S.storySeen && !S.over) showStory(0); }
  else showTitle();
  renderGuide(true);
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(() => ({ S, cam:{ ...cam } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
